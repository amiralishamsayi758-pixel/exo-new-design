<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      .neon {
        text-shadow:
          0 0 6px #a855f7,
          0 0 12px #a855f7;
      }
    </style>
  </head>

  <body class="bg-gray-900 min-h-screen flex flex-col">
    <!-- HEADER -->
    <header
      class="bg-gray-950 text-white px-10 py-8 flex items-center justify-between"
    >
      <nav class="hidden md:flex gap-6 text-gray-300">
        <a href="amir.html" class="hover:text-white text-2xl">خانه</a>
        <a href="buy.html" class="hover:text-white text-2xl">محصولات</a>
        <a href="aboutus.html" class="hover:text-white text-2xl">درباره ما</a>
        <a href="#" class="hover:text-white text-2xl">تماس</a>
      </nav>

      <!-- وسط (لوگو) -->
      <div
        class="absolute left-1/2 -translate-x-1/2 text-4xl font-bold select-none"
      >
        <span class="text-purple-400 neon">EXO</span
        ><i class="fa-solid fa-headset"></i>
      </div>
      <a
        href="amir.html"
        class="bg-purple-600 px-6 py-3 rounded-xl text-white font-bold transition transform hover:scale-110 hover:bg-purple-500 hover:shadow-lg hover:shadow-purple-500/50"
      >
        بازگشت
      </a>
    </header>

    <!-- HERO -->
    <section class="text-center py-20">
      <h2 class="text-4xl md:text-6xl text-white font-bold">
        ورود به <span class="neon text-purple-400">اکسپو گیم</span>
      </h2>

      <p class="text-gray-400 mt-4">به دنیای تجهیزات گیمینگ خوش آمدی</p>
    </section>

    <!-- LOGIN FORM -->
    <section class="flex justify-center flex-1">
      <div
        class="bg-gray-800 p-8 rounded-2xl w-full max-w-md flex flex-col gap-2"
      >
        <h3 class="text-2xl font-bold mb-6 text-center text-white">فرم ورود</h3>

        <input
          type="text"
          placeholder="نام کاربری"
          class="w-full p-3 mb-4 rounded-xl bg-gray-700 outline-none"
        />

        <input
          type="password"
          placeholder="رمز عبور"
          class="w-full p-3 mb-4 rounded-xl bg-gray-700 outline-none"
        />

        <button
          class="w-full bg-purple-500 hover:bg-purple-600 py-3 rounded-xl transition"
        >
          ورود
        </button>
        <button
          class="w-full bg-white hover:bg-purple-500 py-3 rounded-xl transition"
        >
          ایجاد حساب کاربری
        </button>
        <button
          class="w-full bg-white hover:bg-purple-500 py-3 rounded-xl transition"
        >
          فراموشی رمز
        </button>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-gray-950 text-white py-10 px-6 mt-10">
      <div class="text-center">
        <h3
          class="text-2xl font-bold text-purple-400 flex items-center gap-2 justify-center w-full"
        >
          اگزو گیم
          <i class="fa-solid fa-ghost text-gray-400"></i>
        </h3>
        <p class="text-gray-400 mt-2 select-none">
          فروشگاه تخصصی تجهیزات گیمینگ
        </p>

        <p class="text-gray-500 mt-4">
          <i class="fa-solid fa-location-dot"></i>
          تهران، خیابان ولیعصر
        </p>

        <p class="text-gray-500">
          <i class="fa-solid fa-phone"></i>
          099254685
        </p>
      </div>
    </footer>
  </body>
</html>
