<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .neon {
        text-shadow:
          0 0 6px #a855f7,
          0 0 12px #a855f7;
      }
    </style>
  </head>

  <body class="bg-gray-900">
    <!-- HEADER -->
    <header class="bg-gray-950 px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-purple-400">Exo Game 🎮</h1>

      <nav class="hidden md:flex gap-6 text-gray-300">
        <a href="#" class="hover:text-white">خانه</a>
        <a href="#" class="hover:text-white">محصولات</a>
        <a href="#" class="hover:text-white">تماس</a>
      </nav>
    </header>

    <!-- HERO -->
    <section class="text-center py-20">
      <h2 class="text-4xl md:text-6xl font-bold">
        ورود به <span class="neon text-purple-400">اکسپو گیم</span>
      </h2>

      <p class="text-gray-400 mt-4">به دنیای تجهیزات گیمینگ خوش آمدی</p>
    </section>

    <!-- LOGIN FORM -->
    <section class="flex justify-center">
      <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md">
        <h3 class="text-2xl font-bold mb-6 text-center">فرم ورود</h3>

        <input
          type="text"
          placeholder="نام کاربری"
          class="w-full p-3 mb-4 rounded-xl bg-gray-700 outline-none"
        />

        <input
          type="password"
          placeholder="رمز عبور"
          class="w-full p-3 mb-4 rounded-xl bg-gray-700 outline-none"
        />

        <button
          class="w-full bg-purple-500 hover:bg-purple-600 py-3 rounded-xl transition"
        >
          ورود
        </button>
      </div>
    </section>

    <!-- FEATURE CARDS -->
    <section class="py-16 px-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-gray-800 p-6 rounded-xl hover:scale-105 transition">
          ⚡ سرعت بالا
        </div>

        <div class="bg-gray-800 p-6 rounded-xl hover:scale-105 transition">
          🛡️ امنیت
        </div>

        <div class="bg-gray-800 p-6 rounded-xl hover:scale-105 transition">
          🎮 تجربه گیمینگ
        </div>
        <div class="bg-gray-800 p-6 rounded-xl hover:bg-gray-700 transition">
          📞 پشتیبانی 24 ساعته
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-gray-950 py-10 text-center text-gray-400">
      © 2026 Exo Game
    </footer>
  </body>
</html>
