<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      .neon {
        text-shadow:
          0 0 4px #a855f7,
          0 0 8px #a855f7;
      }

      @keyframes ghostFloat {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0);
        }
      }

      .ghost-effect {
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .ghost-effect:hover {
        animation: ghostFloat 1.5s ease-in-out infinite;
        text-shadow:
          0 0 10px #fff,
          0 0 20px #fff,
          0 0 40px #fff;
      }
    </style>
  </head>

  <body class="bg-gray-900">
    <!-- HEADER -->
    <header
      class="bg-gray-950 text-white px-10 py-6 flex items-center justify-between"
    >
      <!-- LEFT NAV -->
      <nav class="hidden md:flex gap-6 text-gray-300">
        <a href="amir.html" class="hover:text-white text-2xl">خانه</a>
        <a href="buy.html" class="hover:text-white text-2xl">محصولات</a>
        <a href="aboutus.html" class="hover:text-white text-2xl">درباره ما</a>
        <a href="#" class="hover:text-white text-2xl">تماس</a>
      </nav>

      <!-- SEARCH -->
      <div class="flex-1 flex justify-center">
        <div class="relative w-[60%]">
          <input
            type="text"
            placeholder="جستجوی محصول..."
            class="w-full py-2 px-4 rounded-xl bg-gray-800 text-white outline-none focus:ring-2 focus:ring-purple-500"
          />
          <i
            class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"
          ></i>
        </div>
      </div>

      <!-- LOGO -->
      <div class="flex items-center gap-4">
        <div class="text-4xl font-bold select-none">
          <span class="text-purple-400 neon">EXO</span>
          <i class="fa-solid fa-headset ghost-effect"></i>
        </div>

        <a
          href="login.html"
          class="bg-purple-600 px-6 py-3 rounded-xl text-white font-bold transition transform hover:scale-110 hover:bg-purple-500"
        >
          ورود / ثبت‌نام
        </a>
      </div>
    </header>

    <section
      class="relative w-full min-h-[500px] bg-gray-900 flex flex-row-reverse items-center justify-between px-20 py-20 overflow-hidden"
    >
      <!-- BACKGROUND GLOW -->
      <div
        class="absolute w-[400px] h-[400px] bg-purple-600 opacity-20 blur-3xl rounded-full top-[-100px] right-[-100px]"
      ></div>
      <div
        class="absolute w-[300px] h-[300px] bg-pink-500 opacity-20 blur-3xl rounded-full bottom-[-80px] left-[-80px]"
      ></div>

      <!-- TEXT -->
      <div class="text-right text-white max-w-lg relative z-10">
        <h2 class="text-5xl font-bold leading-tight">
          جدیدترین <span class="text-purple-400">مانیتورهای گیمینگ</span>
        </h2>

        <p class="text-gray-400 mt-4 text-xl">
          تجربه بازی با کیفیت 4K و نرخ تازه‌سازی بالا
        </p>

        <button
          class="mt-6 bg-gradient-to-r from-purple-600 to-pink-500 px-8 py-3 rounded-xl text-white font-bold hover:scale-110 transition"
        >
          مشاهده محصولات
        </button>
      </div>

      <!-- IMAGE -->
      <div class="relative">
        <img
          src="images/monitor.jpg.jpg"
          class="w-[450px] rounded-2xl shadow-2xl hover:scale-105 transition duration-500"
        />

        <!-- GLOW پشت عکس -->
        <div
          class="absolute inset-0 bg-purple-500 opacity-20 blur-2xl rounded-2xl -z-10"
        ></div>
      </div>
    </section>
  </body>
</html>
